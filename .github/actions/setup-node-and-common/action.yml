name: "Setup Node"
description: "Setup Node and build Common"

runs:
  using: "composite"
  steps:
    - name: Use Node
      id: node
      uses: actions/setup-node@v7
      with:
        node-version-file: 'package.json'
    - name: Common deps and build
      shell: bash
      run: |
        yarn install --immutable --immutable-cache
        yarn workspace common build
