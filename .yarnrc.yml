supportedArchitectures:
  cpu:
    - x64
  os:
    - linux
    - win32
  libc:
    - glibc

approvedGitRepositories:
  - "**"

compressionLevel: mixed

enableGlobalCache: false

enableScripts: true

npmMinimalAgeGate: 0

packageExtensions:
  "@mui/styled-engine@*":
    dependencies:
      "@emotion/react": "*"
      "@emotion/styled": "*"
  jotai-devtools@*:
    dependencies:
      react-dom: "*"
  jotai-immer@*:
    dependencies:
      react: "*"
      react-dom: "*"
  jotai@*:
    dependencies:
      react: "*"
      react-dom: "*"
  ra-core@*:
    dependencies:
      react: "*"
      react-dom: "*"
      react-hook-form: "*"
      react-router: "*"
      react-router-dom: "*"
  ra-ui-materialui@*:
    dependencies:
      "@mui/system": "*"
      "@mui/utils": "*"
      csstype: "*"
      react-is: "*"

yarnPath: .yarn/releases/yarn-4.18.0.cjs
